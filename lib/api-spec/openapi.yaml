openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Recruiter API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job postings
  - name: candidates
    description: Candidate profiles
  - name: applications
    description: Job applications and pipeline
  - name: pipeline
    description: Pipeline statistics and overview
  - name: tools
    description: Recruiter productivity tools

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, draft]
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List all candidates
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Add a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Delete a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
        - name: candidateId
          in: query
          schema:
            type: integer
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create an application (link candidate to job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application (stage, notes, score)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /pipeline/stats:
    get:
      operationId: getPipelineStats
      tags: [pipeline]
      summary: Get pipeline overview statistics
      responses:
        "200":
          description: Pipeline stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStats"

  /pipeline/activity:
    get:
      operationId: getRecentActivity
      tags: [pipeline]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /jobs/{id}/sourcing:
    get:
      operationId: getJobSourcing
      tags: [tools]
      summary: Get sourcing strategy with Boolean search strings and LinkedIn URLs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sourcing strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcingStrategy"
        "404":
          description: Not found

  /jobs/{id}/interview-questions:
    get:
      operationId: getInterviewQuestions
      tags: [tools]
      summary: Get stage-by-stage interview question bank for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interview question bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewQuestionBank"
        "404":
          description: Not found

  /applications/{id}/email-template:
    post:
      operationId: generateEmailTemplate
      tags: [tools]
      summary: Generate an email template for a candidate at this application stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateRequest"
      responses:
        "200":
          description: Email template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Not found

  /applications/{id}/screen:
    post:
      operationId: screenApplication
      tags: [tools]
      summary: Save a CV screening evaluation for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningInput"
      responses:
        "200":
          description: Updated application with screening result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found

  /applications/bulk-stage:
    patch:
      operationId: bulkUpdateStage
      tags: [applications]
      summary: Move multiple applications to a new stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStageUpdate"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkStageResult"

  /candidates/export:
    get:
      operationId: exportCandidates
      tags: [candidates]
      summary: Export candidates as CSV
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /pipeline/funnel:
    get:
      operationId: getPipelineFunnel
      tags: [pipeline]
      summary: Get stage-by-stage funnel counts
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Funnel breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelStage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Job:
      type: object
      required: [id, title, department, location, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        department:
          type: string
        location:
          type: string
        status:
          type: string
          enum: [open, closed, draft]
        description:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        employmentType:
          type: ["string", "null"]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        applicantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobInput:
      type: object
      required: [title, department, location]
      properties:
        title:
          type: string
          minLength: 1
        department:
          type: string
        location:
          type: string
        status:
          type: string
          enum: [open, closed, draft]
        description:
          type: string
        requirements:
          type: string
        employmentType:
          type: string
        salaryMin:
          type: integer
        salaryMax:
          type: integer

    JobUpdate:
      type: object
      properties:
        title:
          type: string
        department:
          type: string
        location:
          type: string
        status:
          type: string
          enum: [open, closed, draft]
        description:
          type: string
        requirements:
          type: string
        employmentType:
          type: string
        salaryMin:
          type: integer
        salaryMax:
          type: integer

    Candidate:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        currentTitle:
          type: ["string", "null"]
        currentCompany:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        resumeSummary:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CandidateInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
        currentTitle:
          type: string
        currentCompany:
          type: string
        location:
          type: string
        linkedinUrl:
          type: string
        githubUrl:
          type: string
        resumeSummary:
          type: string
        tags:
          type: array
          items:
            type: string

    CandidateUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        currentTitle:
          type: string
        currentCompany:
          type: string
        location:
          type: string
        linkedinUrl:
          type: string
        githubUrl:
          type: string
        resumeSummary:
          type: string
        tags:
          type: array
          items:
            type: string

    Application:
      type: object
      required: [id, jobId, candidateId, stage, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        candidateId:
          type: integer
        stage:
          type: string
          enum: [applied, screening, interview, offer, hired, rejected]
        fitScore:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        rejectionReason:
          type: ["string", "null"]
        outreachStatus:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        job:
          $ref: "#/components/schemas/Job"
        candidate:
          $ref: "#/components/schemas/Candidate"

    ApplicationInput:
      type: object
      required: [jobId, candidateId]
      properties:
        jobId:
          type: integer
        candidateId:
          type: integer
        stage:
          type: string
          enum: [applied, screening, interview, offer, hired, rejected]
        fitScore:
          type: integer
        notes:
          type: string

    ApplicationUpdate:
      type: object
      properties:
        stage:
          type: string
          enum: [applied, screening, interview, offer, hired, rejected]
        fitScore:
          type: integer
        notes:
          type: string
        rejectionReason:
          type: string
        outreachStatus:
          type: string

    PipelineStats:
      type: object
      required: [totalJobs, openJobs, totalCandidates, activeApplications, hiredThisMonth, avgFitScore, stageBreakdown]
      properties:
        totalJobs:
          type: integer
        openJobs:
          type: integer
        totalCandidates:
          type: integer
        activeApplications:
          type: integer
        hiredThisMonth:
          type: integer
        avgFitScore:
          type: ["number", "null"]
        stageBreakdown:
          type: object
          additionalProperties:
            type: integer

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        candidateName:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    FunnelStage:
      type: object
      required: [stage, count, percentage]
      properties:
        stage:
          type: string
        count:
          type: integer
        percentage:
          type: number

    SourcingStrategy:
      type: object
      required: [jobTitle, booleanStrings, linkedinUrls, channels]
      properties:
        jobTitle:
          type: string
        booleanStrings:
          type: array
          items:
            $ref: "#/components/schemas/BooleanSearch"
        linkedinUrls:
          type: array
          items:
            $ref: "#/components/schemas/LinkedinSearchUrl"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SourcingChannel"

    BooleanSearch:
      type: object
      required: [label, title, keywords]
      properties:
        label:
          type: string
        title:
          type: string
        keywords:
          type: string

    LinkedinSearchUrl:
      type: object
      required: [label, url, angle]
      properties:
        label:
          type: string
        url:
          type: string
        angle:
          type: string

    SourcingChannel:
      type: object
      required: [channel, bestFor, tactic]
      properties:
        channel:
          type: string
        bestFor:
          type: string
        tactic:
          type: string

    InterviewQuestionBank:
      type: object
      required: [jobTitle, stages]
      properties:
        jobTitle:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/InterviewStage"

    InterviewStage:
      type: object
      required: [stage, interviewer, competencies]
      properties:
        stage:
          type: string
        interviewer:
          type: string
        competencies:
          type: array
          items:
            $ref: "#/components/schemas/Competency"

    Competency:
      type: object
      required: [name, questions]
      properties:
        name:
          type: string
        questions:
          type: array
          items:
            type: string

    EmailTemplate:
      type: object
      required: [type, subject, body]
      properties:
        type:
          type: string
        subject:
          type: string
        body:
          type: string

    EmailTemplateRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [advancement, rejection, hold, offer, interview_invite, outreach, follow_up]

    ScreeningResult:
      type: object
      required: [fitScore, recommendation, mustHaveScore, strengths, gaps, notes]
      properties:
        fitScore:
          type: integer
        recommendation:
          type: string
          enum: [advance, hold, reject]
        mustHaveScore:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        notes:
          type: string

    ScreeningInput:
      type: object
      required: [fitScore, recommendation]
      properties:
        fitScore:
          type: integer
          minimum: 0
          maximum: 100
        recommendation:
          type: string
          enum: [advance, hold, reject]
        mustHaveScore:
          type: string
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        notes:
          type: string

    BulkStageUpdate:
      type: object
      required: [applicationIds, stage]
      properties:
        applicationIds:
          type: array
          items:
            type: integer
        stage:
          type: string
          enum: [applied, screening, interview, offer, hired, rejected]
        notes:
          type: string

    BulkStageResult:
      type: object
      required: [updated, failed]
      properties:
        updated:
          type: integer
        failed:
          type: integer
